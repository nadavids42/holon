[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-holon"
version = "0.1.0"
description = "A minimal persistent epistemic workspace"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
holon = "holon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
